[package]
name = "alga2-derive"
version = "0.1.0"
edition = "2024"
authors = ["5-6-1"]
description = "Derive macro for alga2: one line brings a struct into the whole algebraic tower"
license = "MIT OR Apache-2.0"
repository = "https://github.com/5-6-1/alga2-derive-rs"
homepage = "https://github.com/5-6-1/alga2-derive-rs"
documentation = "https://docs.rs/alga2-derive"
readme = "../README.md"
keywords = ["algebra", "derive", "macro", "codegen"]
categories = ["mathematics", "no-std", "development-tools::procedural-macro-helpers"]
rust-version = "1.93.0"
exclude = ["target/"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# The derive's doctests expand against the real tower.
alga2 = { path = ".." }
