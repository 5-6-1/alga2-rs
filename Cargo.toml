[package]
name = "alga2"
version = "0.1.0"
edition = "2024"
authors = ["5-6-1"]
description = "A modern abstract-algebra hierarchy for Rust — the successor to alga, powered by batch-impl"
license = "MIT OR Apache-2.0"
repository = "https://github.com/5-6-1/alga2-rs"
homepage = "https://github.com/5-6-1/alga2-rs"
documentation = "https://docs.rs/alga2"
readme = "README.md"
keywords = ["algebra", "monoid", "group", "ring", "field"]
categories = ["mathematics", "no-std"]
rust-version = "1.93.0"
exclude = ["rustfmt.toml", ".github/", ".idea/", "proptest-regressions/", "Cargo.lock"]

[dependencies]
# The impl matrices are generated by batch-impl (build-time only; nothing
# from it is linked into downstream builds).
batch-impl = "0.9"
# Optional: powers the exported law-testing strategies (src/laws) for
# downstream users. Re-declared as a dev-dependency so `cargo test` can use
# it without enabling the feature.
proptest = { version = "1", optional = true }

[dev-dependencies]
# Property-based testing for the algebraic laws (associativity / identity /
# inverses / distributivity) — see src/laws.
proptest = "1"
# The derive macro: one line brings a struct into the whole tower (tests).
# Lives in its own repo (alga2-derive-rs). Path-only: cargo strips path
# dev-deps at publish time, so alga2 publishes independently.
alga2-derive = { path = "D:/CS/Rust/alga2-derive-rs" }

[features]
# Mainstream users get the full matrix out of the box; embedded/no_std users
# write `default-features = false` (the ecosystem-standard posture).
default = ["std"]
# HashMap/HashSet-style impl matrices.
std = ["alloc"]
# Vec/String/Box-style impl matrices.
alloc = []
# Exports src/laws (proptest strategies) for testing downstream custom types.
proptest = ["dep:proptest", "std"]
